name: Build research audit PDFs

on:
  push:
    branches: [main]
    paths:
      - 'report/*.md'
      - 'scripts/render_audit_pdf.py'
      - '.github/workflows/build-report-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-audit-pdfs-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check "Markdown==3.10" "weasyprint==66.0"

      - name: Render missing PDFs
        run: python scripts/render_audit_pdf.py

      - name: Commit generated PDF files
        run: |
          git add -A -- report
          if git diff --cached --quiet; then
            echo "No new PDFs to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: generate audited PDF reports"
          git pull --rebase origin main
          git push origin HEAD:main
